server:
  port: 8081
spring:
  application:
    name: booking-service
  datasource:
    url: 'jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL'
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  cloud:
    compatibility-verifier:
      enabled: false
security:
  jwt:
    secret: '${JWT_SECRET:local-dev-secret-key-change-me-32-bytes-minimum!}'
hotel:
  base-url: '${HOTEL_SERVICE_URL:http://hotel-service}'
  internal-key: '${INTERNAL_SERVICE_KEY:local-internal-key}'
  timeout-ms: 1500
  max-attempts: 3
  retry-delay-ms: 200
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{36} - %msg%n'
