server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: bookings
            uri: lb://booking-service
            predicates:
              - 'Path=/api/booking/**,/api/bookings/**,/api/user/**'
          - id: hotels
            uri: lb://hotel-service
            predicates:
              - 'Path=/api/hotels/**'
          - id: rooms-read
            uri: lb://hotel-service
            predicates:
              - 'Path=/api/rooms/**'
              - 'Method=GET'
          - id: rooms-management
            uri: lb://hotel-service
            predicates:
              - 'Path=/api/rooms,/api/rooms/*,/api/rooms/*/availability'
              - 'Method=POST,PATCH,DELETE'
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
